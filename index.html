    <script>
      (() => {
        const storedTheme = window.localStorage.getItem('site-theme');
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches;
        const theme =
          storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : prefersDark
              ? 'dark'
              : 'light';
        const themeColor = theme === 'dark' ? '#0e0e0e' : '#fbfbfb';

        document.documentElement.dataset.theme = theme;
        // Sections fade in on scroll only in a real browser session; without
        // JavaScript, or in an automated browser that never scrolls, they
        // simply show.
        if (!navigator.webdriver) document.documentElement.dataset.animate = '';
        // Only Chromium can run an SVG filter on what's behind an element.
        if (/Chrome\//.test(navigator.userAgent))
          document.documentElement.dataset.glass = '';
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', themeColor);
      })();
    </script>
