<!doctype html>
<!-- The animated link preview: the home page's coastal painting, drawn the way
     the site draws it (drifting clouds, glints on the water, the palm frond
     swaying, gulls crossing the sky), behind a glass name pill. render.mjs
     steps it frame by frame with window.frame(t), t in [0, 1); everything
     moves on whole cycles of the loop, so t = 1 meets t = 0 seamlessly. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #fbfbfb;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 1280px;
        height: 720px;
      }
      .pill {
        position: absolute;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        padding: 14px 38px 20px;
        border-radius: 999px;
        overflow: hidden;
        isolation: isolate;
        font:
          italic 400 64px/1 'Bodoni Moda',
          serif;
        letter-spacing: -0.01em;
        color: #161616;
        background: rgb(255 255 255 / 0.42);
        backdrop-filter: blur(22px) saturate(1.5);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.9),
          inset 0 0 0 1.5px rgb(255 255 255 / 0.65),
          0 12px 40px rgb(10 20 29 / 0.22);
      }
      /* A highlight that crosses the glass once per loop. */
      .sheen {
        position: absolute;
        inset: -40% auto -40% 0;
        width: 120px;
        background: linear-gradient(
          100deg,
          transparent,
          rgb(255 255 255 / 0.55),
          transparent
        );
        rotate: 18deg;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1280" height="720"></canvas>
    <div class="pill">Timothy Markfeld<span class="sheen"></span></div>
    <script>
      const W = 1280;
      const H = 720;
      const TAU = Math.PI * 2;
      const ctx = document.getElementById('c').getContext('2d');
      const load = (src) =>
        new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.src = src;
        });

      // The same shapes the site draws, in the painting's own 1536 × 1024
      // coordinates.
      const clouds = [
        'M380 350c15-23 41-28 65-16 8-35 55-48 81-18 28-14 60 0 63 23 34-10 64 0 76 20H380Z',
        'M730 210c25-25 47-22 65-13 8-39 57-51 89-18 25-12 60 0 65 23 27-8 57 0 74 21H730Z',
        'M900 380c22-20 42-19 59-10 7-32 48-39 69-15 29-20 63-9 73 17 30-10 50 0 62 17H900Z',
      ].map((d) => new Path2D(d));
      const birds = new Path2D(
        'M0 0q7-5 14 0 7-5 14 0m22-12q5-4 10 0 5-4 10 0',
      );

      // The painting covers the 16:9 card, cropped top and bottom.
      const scale = W / 1536;
      const offsetY = (H - 1024 * scale) / 2;

      let painting;
      let frond;
      const sheen = document.querySelector('.sheen');
      const pill = document.querySelector('.pill');

      window.frame = (t) => {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(painting, 0, offsetY, W, 1024 * scale);

        ctx.save();
        ctx.translate(0, offsetY);
        ctx.scale(scale, scale);
        // Clouds drift once each way per loop.
        ctx.save();
        ctx.translate(Math.sin(t * TAU) * 30, 0);
        const cloud = ctx.createLinearGradient(0, 170, 0, 390);
        cloud.addColorStop(0, 'rgba(255, 253, 240, 0.094)');
        cloud.addColorStop(1, 'rgba(255, 253, 240, 0)');
        ctx.fillStyle = cloud;
        clouds.forEach((path) => ctx.fill(path));
        ctx.restore();
        // Glints on the water, each on a whole number of cycles per loop.
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#fff6d9';
        for (let i = 0; i < 16; i++) {
          const x = 45 + ((i * 113) % 400);
          const y = 570 + ((i * 37) % 220);
          const span = 12 + (y - 555) * 0.1;
          ctx.globalAlpha =
            Math.max(0, Math.sin(t * TAU * (4 - (i % 3)) + i)) * 0.2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(x + span / 2, y - 1.5, x + span, y);
          ctx.stroke();
        }
        ctx.restore();

        // Gulls cross the sky once per loop and wrap off the card, already
        // in view on the first frame so the poster has them too.
        const birdScale = 0.7 * (W / 580);
        const flock = 70 * birdScale;
        ctx.save();
        ctx.translate(
          ((t + 0.3) % 1) * (W + flock * 2) - flock,
          H * 0.16 + Math.sin(t * TAU * 3) * 4,
        );
        ctx.scale(birdScale, birdScale);
        ctx.strokeStyle = '#355654';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 1;
        ctx.stroke(birds);
        ctx.restore();

        // The frond hangs in from the top right, as on the site, swaying.
        const frondWidth = W * 0.36;
        const frondHeight = (frondWidth * frond.height) / frond.width;
        const right = W + W * 0.08;
        const pivotY = offsetY - 1024 * scale * 0.12 + frondHeight * 0.15;
        ctx.save();
        ctx.translate(right, pivotY);
        ctx.rotate((Math.sin(t * TAU) * 3 * Math.PI) / 180);
        ctx.globalAlpha = 0.5;
        ctx.drawImage(
          frond,
          -frondWidth,
          -frondHeight * 0.15,
          frondWidth,
          frondHeight,
        );
        ctx.restore();

        // The sheen sweeps across in the middle of the loop and rests off
        // the pill the rest of the time.
        const s = Math.min(1, Math.max(0, (t - 0.35) / 0.3));
        const ease = s * s * (3 - 2 * s);
        sheen.style.translate = `${-160 + ease * (pill.offsetWidth + 320)}px 0`;
      };

      window.ready = Promise.all([
        load('../../public/coastal-observatory.webp'),
        load('../../public/coastal-frond.webp'),
      ]).then(([p, f]) => {
        painting = p;
        frond = f;
        window.frame(0);
      });
    </script>
  </body>
</html>
