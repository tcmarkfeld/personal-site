<!doctype html>
<!-- The animated link preview: a halftone ribbon of color drifting over
     paper behind a glass name pill. render.mjs steps it frame by frame with
     window.frame(t), t in [0, 1); the motion loops seamlessly at t = 1. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #f4eddd;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 1280px;
        height: 720px;
      }
      .pill {
        position: absolute;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        padding: 14px 38px 20px;
        border-radius: 999px;
        overflow: hidden;
        isolation: isolate;
        font:
          italic 400 64px/1 'Bodoni Moda',
          serif;
        letter-spacing: -0.01em;
        color: #17151c;
        background: rgb(255 255 255 / 0.42);
        backdrop-filter: blur(22px) saturate(1.5);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.9),
          inset 0 0 0 1.5px rgb(255 255 255 / 0.65),
          0 12px 40px rgb(60 20 60 / 0.18);
      }
      /* A highlight that crosses the glass once per loop. */
      .sheen {
        position: absolute;
        inset: -40% auto -40% 0;
        width: 120px;
        background: linear-gradient(
          100deg,
          transparent,
          rgb(255 255 255 / 0.55),
          transparent
        );
        rotate: 18deg;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1280" height="720"></canvas>
    <div class="pill">Timothy Markfeld<span class="sheen"></span></div>
    <script>
      const FRAGMENT = `
precision highp float;
uniform vec2 uSize;
uniform float uLoop;
const float TAU = 6.2831853;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
    mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
    u.y
  );
}
float fbm(vec2 p) {
  float sum = 0.0;
  float amp = 0.5;
  for (int i = 0; i < 5; i++) {
    sum += amp * noise(p);
    p = p * 2.03 + vec2(1.7, 9.2);
    amp *= 0.5;
  }
  return sum;
}

// Time enters only as a point on a circle, so t = 0 and t = 1 match.
vec2 orbit(float phase, float r) {
  float a = uLoop * TAU + phase;
  return vec2(cos(a), sin(a)) * r;
}

// How much ribbon covers p (aspect-corrected, centered), and where along its
// colors it is.
vec2 ribbon(vec2 p) {
  vec2 q = vec2(fbm(p * 1.3 + orbit(0.0, 0.6)), fbm(p * 1.3 + orbit(2.1, 0.6) + 4.0));
  vec2 w = p + (q - 0.5) * 0.55;

  // An S that sweeps across the frame, and a tail that rises off the top.
  float bend = sin(w.x * 2.4 + 0.6 + sin(uLoop * TAU) * 0.35) * 0.2;
  float across = exp(-pow((w.y - bend) / (0.2 + 0.07 * sin(w.x * 3.0 + uLoop * TAU)), 2.0));
  float tailX = -0.08 + 0.12 * sin(w.y * 3.2 - uLoop * TAU);
  float tail = exp(-pow((w.x - tailX) / 0.13, 2.0)) * smoothstep(-0.2, 0.2, -w.y);
  float body = max(across, tail * 0.95);

  float hue = fbm(w * 1.6 + orbit(4.2, 0.9) + 11.0) + w.x * 0.35;
  return vec2(body, hue);
}

vec3 palette(float h) {
  vec3 orange = vec3(1.0, 0.45, 0.22);
  vec3 red = vec3(1.0, 0.17, 0.32);
  vec3 magenta = vec3(1.0, 0.25, 0.72);
  vec3 violet = vec3(0.48, 0.3, 1.0);
  vec3 blue = vec3(0.25, 0.5, 1.0);
  // Back and forth through the colors, never across the blue-orange seam.
  h = abs(fract(h * 0.6) * 2.0 - 1.0);
  if (h < 0.25) return mix(orange, red, h / 0.25);
  if (h < 0.5) return mix(red, magenta, (h - 0.25) / 0.25);
  if (h < 0.7) return mix(magenta, violet, (h - 0.5) / 0.2);
  return mix(violet, blue, smoothstep(0.7, 1.0, h));
}

void main() {
  vec2 px = vec2(gl_FragCoord.x, uSize.y - gl_FragCoord.y);
  vec2 toP = (px - uSize * 0.5) / uSize.y;

  // Halftone: each 5px cell is one dot, sized by the ribbon at its center.
  float cell = 5.0;
  vec2 center = (floor(px / cell) + 0.5) * cell;
  vec2 r = ribbon((center - uSize * 0.5) / uSize.y);
  float body = smoothstep(0.08, 0.95, r.x);
  float dist = length(px - center) / cell;
  float dot = 1.0 - smoothstep(0.5 * sqrt(body) - 0.06, 0.5 * sqrt(body) + 0.06, dist);
  // Dense parts fill in solid; only the edges stay as visible dots.
  float cover = mix(dot, 1.0, smoothstep(0.55, 0.95, body) * 0.85) * step(0.02, body);

  vec3 ink = palette(ribbon(toP).y);
  vec3 paper = vec3(0.957, 0.929, 0.867);
  float grain = hash(floor(px)) - 0.5;
  paper += grain * 0.035;
  vec3 color = mix(paper, ink, cover);
  color += grain * 0.03 * cover;

  gl_FragColor = vec4(color, 1.0);
}
`;
      const canvas = document.getElementById('c');
      const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
      const shader = (type, source) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
          throw new Error(gl.getShaderInfoLog(s));
        return s;
      };
      const program = gl.createProgram();
      gl.attachShader(
        program,
        shader(
          gl.VERTEX_SHADER,
          'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }',
        ),
      );
      gl.attachShader(program, shader(gl.FRAGMENT_SHADER, FRAGMENT));
      gl.linkProgram(program);
      gl.useProgram(program);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
        gl.STATIC_DRAW,
      );
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.uniform2f(
        gl.getUniformLocation(program, 'uSize'),
        canvas.width,
        canvas.height,
      );
      const loop = gl.getUniformLocation(program, 'uLoop');
      const sheen = document.querySelector('.sheen');
      const pill = document.querySelector('.pill');

      window.frame = (t) => {
        gl.uniform1f(loop, t);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        // The sheen sweeps across in the middle of the loop and rests off
        // the pill the rest of the time.
        const s = Math.min(1, Math.max(0, (t - 0.35) / 0.3));
        const ease = s * s * (3 - 2 * s);
        sheen.style.translate = `${-160 + ease * (pill.offsetWidth + 320)}px 0`;
      };
      window.frame(0);
    </script>
  </body>
</html>
